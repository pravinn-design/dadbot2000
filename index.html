<style>
/* Sparkle edition: costume colors (glitter purple, yellow, orange, silver). One canvas in a 780x360 logical space; glow, scanlines and vignette are cheap composited layers */

  --bg: #000;
  --purple: #b860ff;
  --purple-deep: #6d1fc4;
  --yellow: #ffea3c;
  --silver: #dfe4f0;
  --font-crt: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--yellow); }
body {
  box-sizing: border-box;
  padding: 0;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#wrap { position: relative; width: 100%; height: 100%; transition: opacity 0.4s; }
#crt, #glow, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#crt { pointer-events: auto; }
#glow { mix-blend-mode: screen; opacity: 0.9; }
#fx {
  background:
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.5) 100%),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.3) 2px, rgba(0, 0, 0, 0.3) 3px);
}
#start {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  font-family: var(--font-crt); font-size: 24px; letter-spacing: 0.12em;
  color: var(--yellow); background: var(--purple-deep); border: 2px solid var(--silver); padding: 8px 26px; cursor: pointer; z-index: 5;
  box-shadow: 0 0 18px rgba(184, 96, 255, 0.75);
  animation: pulse 1.6s ease-in-out infinite;
}
#start:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 4px rgba(184, 96, 255, 0.3); } }
#safe { position: fixed; visibility: hidden; pointer-events: none; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

<div id="wrap">
  <canvas id="crt" aria-hidden="true"></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div id="fx" aria-hidden="true"></div>
</div>
<div id="safe" aria-hidden="true"></div>
<p class="sr">DadBot2000 sparkle edition, an animated retro robot chest display with a robot face, fun dial, radar, oscilloscope, dad jokes, a candy counter and a costume scanner.</p>
<button id="start" type="button">START DADBOT</button>

<script>
(function () {

    batA: ["##.......##", "###.#.#.###", ".#########.", "...#####...", "....#.#...."],
    batB: ["....#.#....", "...#####...", ".#########.", "###.....###", "##.......##"],

    spider2: [".#.....#.", "#.#.#.#.#", "..#####..", "#.#.#.#.#", ".#.....#."],

    b_cat: ["#...#", "#####", "#.#.#", "#####", ".###."],
    b_kid: [".#.", "###", ".#.", "#.#"],
    b_bat: ["#..#..#", "#######", ".#...#."]

    { n: "CANDY", c: YELLOW, px: ["#...#####...#", "##.#######.##", "#############", "##.#######.##", "#...#####...#"] },

  function updateGlints(dt) {

      if (bootHold > 0.7) {
        state = "crt"; crtT = 0;
        slots.forEach(function (s, k) { s.blank = true; s.tr = -1; s.i = 0; s.delay = 0.5 + k * 0.3; });
      }
    }
  }
  function drawBoot(t) {
    bezel(t);
    var rem = bootPos, y = 46, cx = 40, cy = 46;
    for (var i = 0; i < BOOT.length; i++) {
      var n = Math.max(0, Math.min(BOOT[i].length, Math.floor(rem))), shown = BOOT[i].slice(0, n);
      txt(shown, 40, y, 22, 0.95, "left", 1, BOOTC[i]);
      font(22); cx = 40 + ctx.measureText(shown).width; cy = y;
      rem -= BOOT[i].length + 1;
      if (rem < 0) break;
      y += 27;
    }
    if (Math.floor(t * 3) % 2) { ctx.fillStyle = C(1, 1, YELLOW); ctx.fillRect(cx + 3, cy - 17, 11, 20); }
  }

  /* ---------- main loop (capped at 30fps, 20fps in eco, to save battery) ---------- */
  function update(dt) {
    if (alertState.on) { alertState.t += dt; if (alertState.t > 4.5) alertState.on = false; }
    alertMix += ((alertState.on ? 1 : 0) - alertMix) * Math.min(1, dt * 6);
    if (state === "boot") updateBoot(dt);
    else updateSlots(dt);
    if (state === "crt") { crtT += dt; if (crtT >= 0.5) state = "run"; }
    if (state === "run") { nextAuto -= dt; if (nextAuto <= 0 && !scan.on) { triggerAlert(); nextAuto = 90 + Math.random() * 90; } }
    if (state !== "boot") updateCritter(dt);
    updateFace(dt); updateParts(dt); updateGlints(dt); updateScan(dt);
    tAcc += dt;
    while (tAcc > 0.045) {
      tAcc -= 0.045;
      if (tChars < tickNow().length) tChars++;
      else if (++tHold > 55) { if (tMsg) tMsg = null; else tIdx = (tIdx + 1) % TICKS.length; tChars = 0; tHold = 0; }
    }
    hexAcc += dt;
    if (hexAcc > 0.12) { hexAcc = 0; hexB.shift(); hexB.push(rh()); hot--; if (hot < 0 || Math.random() < 0.05) hot = Math.floor(Math.random() * 22); }
    ledAcc += dt;
    if (ledAcc > 0.15) { ledAcc = 0; var li2 = 1 + Math.floor(Math.random() * 7); leds[li2] = !leds[li2]; }
    leds[0] = level > 0.05 || Math.floor(T * 2) % 2 === 0;
    loadAcc += dt;
    if (loadAcc > 0.7) { loadAcc = 0; load = 0.15 + Math.random() * 0.75; }
  }

  function render(t, dt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(sc, 0, 0, sc, ox, oy);
    ctx.textBaseline = "alphabetic";
    ink0 = YELLOW;
    if (state === "boot") drawBoot(t);
    else if (state === "crt") {
      var p = Math.min(1, crtT / 0.5), e = 1 - Math.pow(1 - p, 3), hh = Math.max(2, H * e);
      ctx.save(); ctx.beginPath(); ctx.rect(0, H / 2 - hh / 2, W, hh); ctx.clip(); drawScene(t, dt); ctx.restore();
      ctx.fillStyle = C(1 - p * 0.7, 1, PURPLE); ctx.fillRect(0, H / 2 - hh / 2 - 1, W, 2); ctx.fillRect(0, H / 2 + hh / 2 - 1, W, 2);
      if (p < 0.25) { ctx.fillStyle = "rgba(240,232,255," + (1 - p * 4) + ")"; ctx.fillRect(40, H / 2 - 1.5, W - 80, 3); }
    } else drawScene(t, dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, mid.width, mid.height); mctx.drawImage(cv, 0, 0, mid.width, mid.height);
    gctx.clearRect(0, 0, gl.width, gl.height); gctx.drawImage(mid, 0, 0, gl.width, gl.height);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var el = now - last;
    if (el < 1000 / FPS - 4) return;
    var dt = Math.min(0.1, Math.max(0, el / 1000)); last = now; T += dt;
    simAudio(T);
    update(dt);
    render(T, dt);
  }
  requestAnimationFrame(frame);

  /* ---------- input, wake lock ---------- */
  function keepAwake() {
    try {
      if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {});
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { if (state !== "attract") keepAwake(); last = performance.now(); }
  });

  var startBtn = document.getElementById("start");
  startBtn.addEventListener("click", function () {
    startBtn.hidden = true;
    try {
      var de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rf && !navigator.standalone) { var r = rf.call(de); if (r && r.catch) r.catch(function () {}); }
    } catch (e) {}
    keepAwake();
    state = "boot"; bootPos = 0; bootHold = 0;
  });

  function endHold() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }
  cv.addEventListener("pointerup", endHold);
  cv.addEventListener("pointercancel", endHold);
  cv.addEventListener("pointerleave", endHold);
  cv.addEventListener("pointerdown", function (e) {
    if (state !== "run" && state !== "attract") return;
    var r = cv.getBoundingClientRect();
    var lx = ((e.clientX - r.left) * dpr - ox) / sc, ly = ((e.clientY - r.top) * dpr - oy) / sc;
    if (state === "run") {
      if (ly < 48) {
        if (lx >= 462 && lx <= 646) { addCandy(lx, ly); endHold(); holdTimer = setTimeout(resetCandy, 1500); }
        else triggerAlert();
        return;
      }
      if (ly >= 266 && ly <= 302) { if (lx < 549) startScan(); else toggleEco(); return; }
      if (scan.on) return;
    }
    slots.forEach(function (s) {
      if (lx < s.x || lx > s.x + s.w || ly < s.y || ly > s.y + s.h) return;
      var m = s.mods[s.i];
      if (m === FACE && !s.blank && s.tr < 0) { boop(lx, ly); return; }
      if (m === DIAL && !s.blank && s.tr < 0) { spinDial(); spawn({ txt: pick(["WHEE!", "ZOOM!", "TURBO!"]), x: lx, y: ly - 6, vy: -45, life: 1, sz: 24, c: ORANGE }); return; }
      if (s.tr < 0 && s.delay <= 0) go(s);
    });
    if (ly > 300) { if (tMsg) tMsg = null; else tIdx = (tIdx + 1) % TICKS.length; tChars = 0; tHold = 0; }
  });
})();
</script>
