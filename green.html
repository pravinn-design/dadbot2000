<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DadBot2000"><meta name="theme-color" content="#000000"></head><body><title>DadBot2000</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: one canvas CRT filling the screen, drawn in a 780x360 logical space; glow, scanlines and vignette are cheap composited layers */
:root {
  --bg: #000;
  --ph: #39ff6a;
  --font-crt: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ph); }
body {
  box-sizing: border-box;
  padding-block: 0;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#wrap { position: relative; width: 100%; height: 100%; }
#crt, #glow, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#crt { pointer-events: auto; }
#glow { mix-blend-mode: screen; opacity: 0.9; }
#fx {
  background:
    radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.5) 100%),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.32) 2px, rgba(0, 0, 0, 0.32) 3px);
}
#start {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  font-family: var(--font-crt); font-size: 24px; letter-spacing: 0.12em;
  color: var(--bg); background: var(--ph); border: 0; padding: 8px 26px; cursor: pointer; z-index: 5;
  box-shadow: 0 0 18px rgba(57, 255, 106, 0.6);
  animation: pulse 1.6s ease-in-out infinite;
}
#start:focus-visible { outline: 2px solid var(--ph); outline-offset: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 4px rgba(57, 255, 106, 0.3); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { #start { animation: none; } }
</style>

<div id="wrap">
  <canvas id="crt" aria-hidden="true"></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div id="fx" aria-hidden="true"></div>
</div>
<p class="sr">DadBot2000, an animated retro robot chest display with a robot face, radar, oscilloscope, dad jokes and status ticker.</p>
<button id="start" type="button">START DADBOT</button>

<script>
(function () {
  "use strict";
  var W = 780, H = 360, TAU = Math.PI * 2, FPS = 30;
  var FONT = '"VT323", "Courier New", monospace';
  var T = 0, last = performance.now();
  var cv = document.getElementById("crt"), ctx = cv.getContext("2d");
  var gl = document.getElementById("glow"), gctx = gl.getContext("2d");
  var mid = document.createElement("canvas"), mctx = mid.getContext("2d");
  var dpr = 1, cw = 1, ch = 1, sc = 1, ox = 0, oy = 0;
  try { if (document.fonts) document.fonts.load('24px "VT323"').catch(function () {}); } catch (e) {}

  function resize() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cw = Math.max(1, Math.round(r.width * dpr));
    ch = Math.max(1, Math.round(r.height * dpr));
    cv.width = cw; cv.height = ch;
    sc = Math.min(cw / W, ch / H);
    ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;
    mid.width = Math.max(1, Math.round(cw / 3)); mid.height = Math.max(1, Math.round(ch / 3));
    gl.width = Math.max(1, Math.round(cw / 6)); gl.height = Math.max(1, Math.round(ch / 6));
  }
  resize();
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

  /* ---------- palette and drawing helpers ---------- */
  var GREEN = [57, 255, 106], ORANGE = [255, 92, 8], P = GREEN.slice(), alertMix = 0;
  function C(a, k) {
    if (k == null) k = 1;
    return "rgba(" + Math.round(P[0] * k) + "," + Math.round(P[1] * k) + "," + Math.round(P[2] * k) + "," + a + ")";
  }
  function font(sz) { ctx.font = sz + "px " + FONT; }
  function txt(s, x, y, sz, a, align, k) {
    font(sz); ctx.textAlign = align || "left"; ctx.fillStyle = C(a == null ? 1 : a, k); ctx.fillText(s, x, y);
  }
  function line(x1, y1, x2, y2, a, k, lw) {
    ctx.strokeStyle = C(a, k); ctx.lineWidth = lw || 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function circ(x, y, r, a, k, lw) {
    ctx.strokeStyle = C(a, k); ctx.lineWidth = lw || 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function brackets(x, y, w, h, l, a, lw) {
    ctx.strokeStyle = C(a == null ? 1 : a); ctx.lineWidth = lw || 2; ctx.beginPath();
    ctx.moveTo(x, y + l); ctx.lineTo(x, y); ctx.lineTo(x + l, y);
    ctx.moveTo(x + w - l, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + l);
    ctx.moveTo(x + w, y + h - l); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - l, y + h);
    ctx.moveTo(x + l, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - l);
    ctx.stroke();
  }
  function grid(x0, y0, x1, y1, nx, ny) {
    var i, x, y;
    ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
    ctx.strokeStyle = C(0.22, 0.7); ctx.beginPath();
    for (i = 0; i <= nx; i++) if (i * 2 !== nx) { x = Math.round(x0 + (x1 - x0) * i / nx) + 0.5; ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (i = 0; i <= ny; i++) if (i * 2 !== ny) { y = Math.round(y0 + (y1 - y0) * i / ny) + 0.5; ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = C(0.45, 0.7); ctx.beginPath();
    x = Math.round((x0 + x1) / 2) + 0.5; y = Math.round((y0 + y1) / 2) + 0.5;
    ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.moveTo(x0, y); ctx.lineTo(x1, y);
    ctx.stroke(); ctx.setLineDash([]);
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function pad2(n) { return ("0" + n).slice(-2); }
  function pad3(n) { return ("00" + n).slice(-3); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function bitmap(rows, cx, cy, ps, alphaFn) {
    var x0 = cx - rows[0].length * ps / 2, y0 = cy - rows.length * ps / 2;
    for (var r = 0; r < rows.length; r++) for (var c = 0; c < rows[r].length; c++) {
      if (rows[r][c] === "#") { ctx.fillStyle = C(alphaFn ? alphaFn() : 1); ctx.fillRect(x0 + c * ps, y0 + r * ps, ps - 1, ps - 1); }
    }
  }
  function spr(rows, x, y, ps, a, flip) {
    ctx.fillStyle = C(a == null ? 1 : a);
    var n = rows[0].length, s = ps * 0.88;
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      for (var c = 0; c < n; c++) if (row[c] === "#") ctx.fillRect(x + (flip ? n - 1 - c : c) * ps, y + r * ps, s, s);
    }
  }
  function wrap(s, maxW, sz) {
    font(sz);
    var words = s.split(" "), out = [], cur = "";
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + " " + words[i] : words[i];
      if (cur && ctx.measureText(test).width > maxW) { out.push(cur); cur = words[i]; } else cur = test;
    }
    if (cur) out.push(cur);
    return out;
  }
  function typeLines(lines, n, x, y, sz, a) {
    var rem = n;
    for (var i = 0; i < lines.length && rem > 0; i++) { txt(lines[i].slice(0, rem), x, y + i * 22, sz, a); rem -= lines[i].length + 1; }
  }

  var SPR = {
    heart: [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."],
    star: ["..#..", "#####", ".###.", ".#.#.", "#...#"],
    batA: ["##.......##", "###.#.#.###", ".#########.", "...#####...", "....#.#...."],
    batB: ["....#.#....", "...#####...", ".#########.", "###.....###", "##.......##"],
    spider: ["#.#...#.#", ".#.###.#.", "..#####..", ".#.###.#.", "#.#...#.#"],
    spider2: [".#.....#.", "#.#.#.#.#", "..#####..", "#.#.#.#.#", ".#.....#."],
    catA: ["........#.#.", "#.......###.", ".#......####", ".##########.", "..#########.", "..#.#...#.#."],
    catB: ["........#.#.", ".#......###.", "#.......####", ".##########.", "..#########.", "...#.#...#.#"],
    jack: ["....#....", "...##....", ".#######.", "##.###.##", "#########", "##.#.#.##", ".#######."],
    smile: ["#.........#", ".#.......#.", "..#######.."],
    grin: ["#############", ".###########.", "..#########..", "....#####...."],
    b_ghost: [".###.", "#####", "#.#.#", "#####", "#.#.#"],
    b_candy: ["#.###.#", "#######", "#.###.#"],
    b_cat: ["#...#", "#####", "#.#.#", "#####", ".###."],
    b_kid: [".#.", "###", ".#.", "#.#"],
    b_bat: ["#..#..#", "#######", ".#...#."]
  };
  var ICONS = [
    { n: "CANDY", px: ["#...#####...#", "##.#######.##", "#############", "##.#######.##", "#...#####...#"] },
    { n: "PUMPKIN", px: [".....#.....", "....##.....", "..#######..", ".#########.", "##.#####.##", "#...###...#", "###########", "##.#.#.#.##", ".#.......#.", "..#######.."] },
    { n: "GHOST", px: ["...#####...", ".#########.", "###########", "##..###..##", "##..###..##", "###########", "####...####", "####...####", "###########", "###########", "#.##.#.##.#"] }
  ];

  /* ---------- audio (mic level only, nothing recorded) ---------- */
  var N = 128, wave = new Float32Array(N), spec = new Float32Array(32);
  var actx = null, an = null, tbuf = null, fbuf = null, live = false, level = 0, peak = 0.05, micState = "idle";

  function readAudio(t) {
    var i, sum = 0, tgt, v;
    if (live && an) {
      an.getByteTimeDomainData(tbuf);
      var mx = 0;
      for (i = 0; i < tbuf.length; i++) { var q = Math.abs(tbuf[i] - 128) / 128; if (q > mx) mx = q; }
      peak = Math.max(peak * 0.994, mx);
      var gain = Math.min(14, Math.max(2.5, 0.7 / Math.max(peak, 0.02)));
      var step = tbuf.length / N;
      for (i = 0; i < N; i++) {
        tgt = clamp((tbuf[Math.floor(i * step)] - 128) / 128 * gain, -1, 1);
        wave[i] += (tgt - wave[i]) * 0.7; sum += Math.abs(tgt);
      }
      an.getByteFrequencyData(fbuf);
      for (i = 0; i < 32; i++) {
        var lo = Math.floor(2 * Math.pow(90, i / 32)), hi = Math.max(lo + 1, Math.floor(2 * Math.pow(90, (i + 1) / 32)));
        var m = 0;
        for (var j = lo; j < hi && j < fbuf.length; j++) if (fbuf[j] > m) m = fbuf[j];
        v = clamp((m - 70) / 150, 0, 1);
        spec[i] += (v - spec[i]) * 0.6;
      }
    } else {
      var e = Math.max(0, Math.sin(t * 1.7) * Math.sin(t * 0.53 + 1.2));
      var env = 0.08 + 0.92 * Math.pow(e, 0.6);
      for (i = 0; i < N; i++) {
        tgt = 0.75 * env * Math.sin(i * 0.42 + t * 14) * (0.6 + 0.4 * Math.sin(i * 1.1 - t * 5));
        wave[i] += (tgt - wave[i]) * 0.7; sum += Math.abs(tgt) * 0.5;
      }
      for (i = 0; i < 32; i++) {
        var b = Math.exp(-Math.pow((i - 7) / 6, 2)) * 0.95 + Math.exp(-Math.pow((i - 17) / 5, 2)) * 0.5;
        v = env * b * (0.65 + 0.35 * Math.sin(t * 9 + i * 1.7)) + Math.random() * 0.04;
        spec[i] += (v - spec[i]) * 0.5;
      }
    }
    level += (sum / N - level) * 0.35;
  }

  /* ---------- particles (boops, candy rain) ---------- */
  var parts = [];
  function spawn(p) { if (parts.length < 70) parts.push(p); }
  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
      p.x += (p.vx || 0) * dt + (p.sway ? Math.sin(T * 3 + p.ph) * p.sway * dt : 0);
      p.y += p.vy * dt;
    }
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], a = Math.min(1, p.life / 0.5);
      if (p.txt) txt(p.txt, p.x, p.y, p.sz, a, "center");
      else spr(p.rows, p.x, p.y, p.ps, a);
    }
  }
  function candyRain(stars) {
    for (var i = 0; i < 26; i++) {
      spawn({ x: 20 + Math.random() * 720, y: -30 - Math.random() * 220, vy: 70 + Math.random() * 60, sway: 30, ph: Math.random() * 6,
        life: 6.5, rows: stars ? SPR.star : pick(ICONS).px, ps: stars ? 3 : 2 });
    }
  }

  /* ---------- DadBot face ---------- */
  var face = { expr: "open", until: 0, blink: 0, nextBlink: 2.5, lx: 0, ly: 0, tx: 0, ty: 0, nextLook: 1, nextMood: 9, boops: 0 };
  var MOODS = { open: "CHEERY", happy: "JOLLY", wink: "SNEAKY", heart: "SMITTEN", squint: "BOOPED", wide: "SPOOKED" };
  function setExpr(e, d) { face.expr = e; face.until = T + d; }
  function updateFace(dt) {
    face.nextBlink -= dt;
    if (face.nextBlink <= 0) { face.blink = 0.2; face.nextBlink = Math.random() < 0.2 ? 0.35 : 2 + Math.random() * 4; }
    face.blink = Math.max(0, face.blink - dt);
    face.nextLook -= dt;
    if (face.nextLook <= 0) { face.tx = Math.random() * 2 - 1; face.ty = Math.random() * 1.2 - 0.6; face.nextLook = 0.7 + Math.random() * 2.5; }
    var k = Math.min(1, dt * 12);
    face.lx += (face.tx - face.lx) * k; face.ly += (face.ty - face.ly) * k;
    if (face.expr !== "open" && T > face.until) face.expr = "open";
    face.nextMood -= dt;
    if (face.nextMood <= 0) {
      if (face.expr === "open") setExpr(pick(["happy", "happy", "wink", "heart"]), 1.6);
      face.nextMood = 7 + Math.random() * 8;
    }
  }
  function eye(cx, cy, kind, side, o) {
    ctx.strokeStyle = C(1); ctx.lineWidth = 7; ctx.lineCap = "square";
    if (kind === "happy") {
      ctx.beginPath(); ctx.moveTo(cx - 16, cy + 8); ctx.lineTo(cx, cy - 9); ctx.lineTo(cx + 16, cy + 8); ctx.stroke(); ctx.lineCap = "butt"; return;
    }
    if (kind === "squint") {
      var d = side < 0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(cx - 13 * d, cy - 14); ctx.lineTo(cx + 12 * d, cy); ctx.lineTo(cx - 13 * d, cy + 14); ctx.stroke(); ctx.lineCap = "butt"; return;
    }
    ctx.lineCap = "butt";
    if (kind === "heart") { var ps = 6 * (1 + 0.12 * Math.sin(T * 10)); spr(SPR.heart, cx - 3.5 * ps, cy - 3 * ps, ps, 1); return; }
    if (kind === "wink" && side > 0) { ctx.fillStyle = C(1); ctx.fillRect(cx - 19, cy - 2, 38, 6); return; }
    var big = kind === "wide", ew = big ? 46 : 38, eh = (big ? 52 : 44) * o;
    ctx.fillStyle = C(1); ctx.fillRect(cx - ew / 2, cy - eh / 2, ew, eh);
    ctx.fillStyle = "#000";
    var cn = Math.min(5, eh / 4);
    ctx.fillRect(cx - ew / 2, cy - eh / 2, cn, cn); ctx.fillRect(cx + ew / 2 - cn, cy - eh / 2, cn, cn);
    ctx.fillRect(cx - ew / 2, cy + eh / 2 - cn, cn, cn); ctx.fillRect(cx + ew / 2 - cn, cy + eh / 2 - cn, cn, cn);
    if (o > 0.45) {
      var pw = big ? 9 : 14, ph = big ? 9 : 16, px = big ? 0 : face.lx * 9, py = big ? 0 : face.ly * 9;
      ctx.fillStyle = "#000"; ctx.fillRect(cx + px - pw / 2, cy + py - ph / 2, pw, ph);
      ctx.fillStyle = C(1); ctx.fillRect(cx + px - pw / 2 + 2, cy + py - ph / 2 + 2, 3, 3);
    }
    if (big) { ctx.fillStyle = C(1); ctx.fillRect(cx - 20, cy - 42, 40, 5); }
  }
  var FACE = { name: "DADBOT", dur: 18, draw: function (w, h) {
    var cx = w / 2, ey = 92, ex = face.expr, k;
    var o = face.blink > 0 ? Math.max(0.08, Math.abs(face.blink - 0.1) / 0.1) : 1;
    eye(cx - 46, ey, ex, -1, o); eye(cx + 46, ey, ex, 1, o);
    if (ex === "heart" || ex === "squint") {
      for (k = 0; k < 3; k++) { line(cx - 68 + k * 7, 130, cx - 63 + k * 7, 122, 0.7, 1, 2); line(cx + 54 + k * 7, 130, cx + 59 + k * 7, 122, 0.7, 1, 2); }
    }
    var my = 162;
    if (level > 0.05) {
      for (k = 0; k < 9; k++) {
        var v = clamp(spec[2 + k * 2] * 1.5 + level, 0, 1) * (1 - Math.abs(k - 4) / 10), hh = 4 + v * 34;
        ctx.fillStyle = C(0.6 + 0.4 * v); ctx.fillRect(cx - 49 + k * 11, my - hh / 2, 8, hh);
      }
    } else if (ex === "wide") { ctx.strokeStyle = C(1); ctx.lineWidth = 5; ctx.strokeRect(cx - 10, my - 12, 20, 24); }
    else if (ex === "open") spr(SPR.smile, cx - 33, my - 9, 6, 1);
    else spr(SPR.grin, cx - 39, my - 12, 6, 1);
    txt("BOOPS " + pad2(Math.min(99, face.boops)), 8, 205, 16, 0.85, "left", 0.75);
    txt(MOODS[ex] || "CHEERY", w - 8, 205, 16, 0.85, "right", 0.75);
  } };
  function boop(x, y) {
    setExpr("squint", 1.2); face.boops++;
    spawn({ txt: "BOOP!", x: x, y: y - 6, vy: -45, life: 1, sz: 24 });
    for (var i = 0; i < 3; i++) spawn({ x: x - 24 + Math.random() * 40, y: y - 10, vy: -50 - Math.random() * 40, sway: 20, ph: Math.random() * 6, life: 1.3, rows: SPR.heart, ps: 2 });
  }

  /* ---------- modules: left slot ---------- */
  var targets = [], TLAB = ["CANDY", "GHOST", "CAT", "KID", "BAT", "CANDY"], sweepA = 0;
  var BLIP = { CANDY: SPR.b_candy, GHOST: SPR.b_ghost, CAT: SPR.b_cat, KID: SPR.b_kid, BAT: SPR.b_bat };
  TLAB.forEach(function (l) {
    targets.push({ a: Math.random() * TAU, r: 0.25 + Math.random() * 0.65, lab: l, lit: 0, da: (Math.random() - 0.5) * 0.1 });
  });
  var RADAR = { name: "RADAR", dur: 16, draw: function (w, h, t, dt) {
    var cx = w / 2, cy = 110, R = 72, k, a, n = 0;
    ctx.fillStyle = C(0.05); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    for (k = 1; k <= 3; k++) circ(cx, cy, R * k / 3, k === 3 ? 0.75 : 0.3, k === 3 ? 0.9 : 0.6, k === 3 ? 1.5 : 1);
    line(cx - R, cy, cx + R, cy, 0.25, 0.6); line(cx, cy - R, cx, cy + R, 0.25, 0.6);
    ctx.strokeStyle = C(0.6, 0.75); ctx.lineWidth = 1; ctx.beginPath();
    for (k = 0; k < 36; k++) {
      a = k / 36 * TAU; var l = k % 3 ? 4 : 8;
      ctx.moveTo(cx + Math.cos(a) * (R + 3), cy + Math.sin(a) * (R + 3)); ctx.lineTo(cx + Math.cos(a) * (R + 3 + l), cy + Math.sin(a) * (R + 3 + l));
    }
    ctx.stroke();
    sweepA = (sweepA + dt * 1.7) % TAU;
    for (k = 0; k < 14; k++) {
      ctx.fillStyle = C(0.3 * (1 - k / 14));
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, sweepA - (k + 1) * 0.07, sweepA - k * 0.07); ctx.closePath(); ctx.fill();
    }
    line(cx, cy, cx + Math.cos(sweepA) * R, cy + Math.sin(sweepA) * R, 1, 1, 2);
    targets.forEach(function (g) {
      g.a = (g.a + g.da * dt + TAU) % TAU;
      if ((sweepA - g.a + TAU) % TAU < 0.12) g.lit = 1;
      g.lit = Math.max(0, g.lit - dt * 0.45);
      if (g.lit === 0 && Math.random() < dt * 0.05) g.r = 0.25 + Math.random() * 0.65;
      var x = cx + Math.cos(g.a) * g.r * R, y = cy + Math.sin(g.a) * g.r * R, bm = BLIP[g.lab];
      if (g.lit > 0.02) spr(bm, x - bm[0].length, y - bm.length, 2, 0.2 + g.lit * 0.8);
      if (g.lit > 0.35) { txt(g.lab, x + 9, y - 5, 15, g.lit); n++; }
    });
    txt("CONTACTS " + pad2(n), 8, 205, 16, 0.85, "left", 0.75);

    else if (c.k === "ghost") spr(ICONS[2].px, c.x, c.y + Math.sin(c.t * 2.5) * 10, 3, 0.55 + 0.25 * Math.sin(c.t * 7));
    else if (c.k === "spider") {
      line(c.x + 13.5, 6, c.x + 13.5, c.y, 0.6, 0.8, 1);
      spr(c.t > 2 && c.t < 4.5 && Math.floor(c.t * 6) % 2 ? SPR.spider2 : SPR.spider, c.x, c.y, 3, 1);
    } else spr(Math.floor(c.t * 6) % 2 ? SPR.catA : SPR.catB, c.x, c.y, 2.5, 1);
  }

  /* ---------- chrome: header, bottom strip, ticker, alerts ---------- */
  var T0 = Date.now();
  function clockStr() { var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
  function upStr() { var s = Math.floor((Date.now() - T0) / 1000); return pad2(Math.floor(s / 3600)) + ":" + pad2(Math.floor(s / 60) % 60) + ":" + pad2(s % 60); }

  var alertState = { on: false, t: 0, msg: "" }, nextAuto = 90 + Math.random() * 60;
  var ALERTS = ["CANDY DETECTED", "GHOST NEARBY", "COSTUME RATED: EPIC", "SUGAR LEVELS CRITICAL", "TRICK OR TREAT?", "SMALL HUMAN: CUTE"];
  function triggerAlert() {
    alertState.on = true; alertState.t = 0; alertState.msg = pick(ALERTS);
    var nice = /CUTE|EPIC/.test(alertState.msg);
    setExpr(nice ? "heart" : "wide", 4.5);
    candyRain(nice);
  }

  function header(t) {
    var status = alertState.on ? "ALERT" : level > 0.06 ? "LISTENING" : "ONLINE";
    spr(SPR.jack, 18, 16, 2.4, 0.75 + Math.random() * 0.25);
    txt("DADBOT2000", 48, 36, 32, 1);
    font(32); var tw = ctx.measureText("DADBOT2000").width;
    txt("// " + status, 48 + tw + 12, 35, 22, alertState.on && Math.floor(t * 6) % 2 ? 1 : 0.85, "left", 0.85);
    txt(clockStr(), 764, 35, 26, 1, "right");
    ctx.fillStyle = C(Math.floor(t * 2) % 2 === 0 ? 1 : 0.15);
    ctx.beginPath(); ctx.arc(656, 27, 4.5, 0, TAU); ctx.fill();
    var lit = Math.round(clamp(level * 4, 0, 1) * 10);
    for (var k = 0; k < 10; k++) { ctx.fillStyle = k < lit ? C(0.5 + 0.05 * k) : C(0.1); ctx.fillRect(572 + k * 7, 20, 5, 13); }
    txt(live ? "MIC LIVE" : "MIC SIM", 564, 34, 20, 0.85, "right", 0.75);
    line(16, 45.5, 764, 45.5, 0.5, 0.6);
    ctx.fillStyle = C(1); ctx.fillRect(16, 44, 46, 2); ctx.fillRect(718, 44, 46, 2);
  }

  function rh() { return ("0" + Math.floor(Math.random() * 256).toString(16).toUpperCase()).slice(-2); }
  var hexB = [], hexAcc = 0, hot = 3, leds = [], ledAcc = 0, load = 0.42, loadAcc = 0;
  for (var hi0 = 0; hi0 < 22; hi0++) hexB.push(rh());
  for (var le0 = 0; le0 < 8; le0++) leds.push(Math.random() < 0.5);
  function bottom() {
    ctx.strokeStyle = C(0.5, 0.6); ctx.lineWidth = 1;
    ctx.strokeRect(16.5, 270.5, 527, 27); ctx.strokeRect(554.5, 270.5, 209, 27);
    for (var i = 0; i < hexB.length; i++) txt(hexB[i], 26 + i * 23.5, 290, 19, i === hot ? 1 : 0.5, "left", i === hot ? 1 : 0.8);
    for (var k = 0; k < 8; k++) { ctx.fillStyle = C(leds[k] ? 1 : 0.12); ctx.fillRect(564 + k * 13, 279, 9, 10); }
    txt("LOAD " + load.toFixed(2), 756, 290, 19, 0.85, "right", 0.8);
  }

  var TICKS = [
    "> HAPPY HALLOWEEN, HUMANS",
    "> SCANNING CANDY... TARGET ACQUIRED",
    "> DETECTING GHOSTS... JUST DAD, FALSE ALARM",
    "> BOOP THE ROBOT FACE. I DARE YOU",
    "> PUMPKIN SPICE LEVELS: CRITICAL",
    "> RUNNING DAD_JOKE.EXE... STAND BY",
    "> WARNING: FUN SIZE IS NOT FULL SIZE",
    "> NICE COSTUME. ANALYZING... 10/10",
    "> PLOTTING TRICK-OR-TREAT ROUTE...",
    "> SKELETON FIRMWARE UPDATE: 99% (BONES)",
    "> CANDY TAX COLLECTED: 3 SNICKERS",
    "> I AM NOT A TOASTER. PLEASE STOP ASKING",
    "> BOO DETECTED. BOO-LEAN LOGIC ENGAGED",
    "> HI HUNGRY, I'M DADBOT2000",
    "> SAY TRICK OR TREAT TO CONTINUE",
    "> BATTERY LOW: NEED SNACK"
  ];
  var tIdx = 0, tChars = 0, tHold = 0, tAcc = 0;
  function ticker(t) {
    ctx.fillStyle = C(0.06); ctx.fillRect(16, 306, 748, 32);
    ctx.strokeStyle = C(0.5, 0.6); ctx.lineWidth = 1; ctx.strokeRect(16.5, 306.5, 747, 31);
    var s = TICKS[tIdx].slice(0, tChars);
    txt(s, 28, 329, 25, 1);
    if (Math.floor(t * 2.5) % 2 === 0) { font(25); ctx.fillStyle = C(1); ctx.fillRect(28 + ctx.measureText(s).width + 4, 312, 11, 20); }
    txt("UP " + upStr(), 754, 328, 19, 0.7, "right", 0.75);
  }

  function hazard(x, y, w, h, t) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.fillStyle = C(0.9);
    var off = (t * 40) % 20;
    ctx.beginPath();
    for (var sx = x - 20 + off; sx < x + w + 20; sx += 20) {
      ctx.moveTo(sx, y + h); ctx.lineTo(sx + 10, y); ctx.lineTo(sx + 20, y); ctx.lineTo(sx + 10, y + h); ctx.closePath();
    }
    ctx.fill(); ctx.restore();
  }
  function drawAlert(t) {
    if (!alertState.on) return;
    var blink = Math.floor(t * 6) % 2 === 0, bx = 150, by = 112, bw = 480, bh = 112;
    ctx.fillStyle = "rgba(0,0,0,0.92)"; ctx.fillRect(bx, by, bw, bh);
    hazard(bx, by, bw, 10, t); hazard(bx, by + bh - 10, bw, 10, t);
    ctx.strokeStyle = C(blink ? 1 : 0.5); ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
    txt("!! ALERT !!", W / 2, by + 40, 24, blink ? 1 : 0.6, "center");
    txt(alertState.msg, W / 2, by + 84, 42, 1, "center");
    if (blink) { ctx.strokeStyle = C(0.9); ctx.lineWidth = 4; rr(9, 9, W - 18, H - 18, 13); ctx.stroke(); }
  }

  function bezel() {
    rr(6, 6, W - 12, H - 12, 14); ctx.fillStyle = "#000"; ctx.fill();
    ctx.strokeStyle = C(0.45, 0.5); ctx.lineWidth = 2; ctx.stroke();
  }

  function drawScene(t, dt) {
    bezel(); header(t);
    for (var k = 0; k < slots.length; k++) drawSlot(slots[k], t, dt);
    bottom(); ticker(t);
    drawCritter(); drawParts(); drawAlert(t);
  }

  /* ---------- boot sequence ---------- */
  var state = "attract", bootPos = 0, bootHold = 0, crtT = 0;
  function bootLines() {
    return [
      "DADBOT2000 BIOS V6.66",
      "(C) 1987 DAD INDUSTRIES",
      "",
      "MEMORY CHECK ............ 640K CANDY OK",
      "LOADING PUN DATABASE .............. OK",
      "INSTALLING DAD JOKES ...... 9001 FOUND",
      "CALIBRATING SPOOK SENSORS ......... OK",
      "RADAR ARRAY ....................... OK",
      "MIC INPUT ......................... " + (micState === "live" ? "ONLINE" : micState === "sim" ? "SIMULATED" : ""),
      "",
      "BOOT COMPLETE. HAPPY HALLOWEEN."
    ];
  }
  function updateBoot(dt) {
    var L = bootLines(), total = 0, cap = Infinity;
    for (var i = 0; i < L.length; i++) {
      if (L[i].indexOf("MIC INPUT") === 0 && micState === "pending") cap = total + L[i].length;
      total += L[i].length + 1;
    }
    bootPos = Math.min(bootPos + dt * 80, cap, total);
    if (bootPos >= total) {
      bootHold += dt;
      if (bootHold > 0.7) {
        state = "crt"; crtT = 0;
        slots.forEach(function (s, k) { s.blank = true; s.tr = -1; s.i = 0; s.delay = 0.5 + k * 0.3; });
      }
    }
  }
  function drawBoot(t) {
    bezel();
    var L = bootLines(), rem = bootPos, y = 46, cx = 40, cy = 46;
    for (var i = 0; i < L.length; i++) {
      var n = Math.max(0, Math.min(L[i].length, Math.floor(rem))), shown = L[i].slice(0, n);
      txt(shown, 40, y, 22, 0.95);
      font(22); cx = 40 + ctx.measureText(shown).width; cy = y;
      rem -= L[i].length + 1;
      if (rem < 0) break;
      y += 27;
    }
    if (Math.floor(t * 3) % 2) { ctx.fillStyle = C(1); ctx.fillRect(cx + 3, cy - 17, 11, 20); }
  }

  /* ---------- main loop (capped at 30fps to save battery) ---------- */
  function update(dt) {
    if (alertState.on) { alertState.t += dt; if (alertState.t > 4.5) alertState.on = false; }
    alertMix += ((alertState.on ? 1 : 0) - alertMix) * Math.min(1, dt * 6);
    for (var c = 0; c < 3; c++) P[c] = GREEN[c] + (ORANGE[c] - GREEN[c]) * alertMix;
    if (state === "boot") updateBoot(dt);
    else updateSlots(dt);
    if (state === "crt") { crtT += dt; if (crtT >= 0.5) state = "run"; }
    if (state === "run") { nextAuto -= dt; if (nextAuto <= 0) { triggerAlert(); nextAuto = 90 + Math.random() * 90; } }
    if (state !== "boot") updateCritter(dt);
    updateFace(dt); updateParts(dt);
    tAcc += dt;
    while (tAcc > 0.045) {
      tAcc -= 0.045;
      if (tChars < TICKS[tIdx].length) tChars++;
      else if (++tHold > 55) { tIdx = (tIdx + 1) % TICKS.length; tChars = 0; tHold = 0; }
    }
    hexAcc += dt;
    if (hexAcc > 0.12) { hexAcc = 0; hexB.shift(); hexB.push(rh()); hot--; if (hot < 0 || Math.random() < 0.05) hot = Math.floor(Math.random() * 22); }
    ledAcc += dt;
    if (ledAcc > 0.15) { ledAcc = 0; var li2 = 1 + Math.floor(Math.random() * 7); leds[li2] = !leds[li2]; }
    leds[0] = level > 0.05 || Math.floor(T * 2) % 2 === 0;
    loadAcc += dt;
    if (loadAcc > 0.7) { loadAcc = 0; load = 0.15 + Math.random() * 0.75; }
  }

  function render(t, dt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(sc, 0, 0, sc, ox, oy);
    ctx.textBaseline = "alphabetic";
    if (state === "boot") drawBoot(t);
    else if (state === "crt") {
      var p = Math.min(1, crtT / 0.5), e = 1 - Math.pow(1 - p, 3), hh = Math.max(2, H * e);
      ctx.save(); ctx.beginPath(); ctx.rect(0, H / 2 - hh / 2, W, hh); ctx.clip(); drawScene(t, dt); ctx.restore();
      ctx.fillStyle = C(1 - p * 0.7); ctx.fillRect(0, H / 2 - hh / 2 - 1, W, 2); ctx.fillRect(0, H / 2 + hh / 2 - 1, W, 2);
      if (p < 0.25) { ctx.fillStyle = "rgba(225,255,232," + (1 - p * 4) + ")"; ctx.fillRect(40, H / 2 - 1.5, W - 80, 3); }
    } else drawScene(t, dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, mid.width, mid.height); mctx.drawImage(cv, 0, 0, mid.width, mid.height);
    gctx.clearRect(0, 0, gl.width, gl.height); gctx.drawImage(mid, 0, 0, gl.width, gl.height);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var el = now - last;
    if (el < 1000 / FPS - 4) return;
    var dt = Math.min(0.1, Math.max(0, el / 1000)); last = now; T += dt;
    readAudio(T);
    update(dt);
    render(T, dt);
  }
  requestAnimationFrame(frame);

  /* ---------- input, mic, wake lock ---------- */
  function keepAwake() {
    try {
      if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function () {});
    } catch (e) {}
  }
  function resumeAudio() { if (actx && actx.state !== "running" && actx.resume) actx.resume(); }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { if (state !== "attract") keepAwake(); resumeAudio(); last = performance.now(); }
  });

  function startMic() {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { micState = "sim"; return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC(); resumeAudio();
    } catch (e) { micState = "sim"; return; }
    micState = "pending";
    var to = setTimeout(function () { if (micState === "pending") micState = "sim"; }, 7000);
    md.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } })
      .then(function (stream) {
        clearTimeout(to); resumeAudio();
        var src = actx.createMediaStreamSource(stream);
        an = actx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.5;
        src.connect(an);
        tbuf = new Uint8Array(an.fftSize); fbuf = new Uint8Array(an.frequencyBinCount);
        live = true; micState = "live";
      })
      .catch(function () { clearTimeout(to); micState = "sim"; });
  }

  var startBtn = document.getElementById("start");
  startBtn.addEventListener("click", function () {
    startBtn.hidden = true;
    try {
      var de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rf && !navigator.standalone) { var r = rf.call(de); if (r && r.catch) r.catch(function () {}); }
    } catch (e) {}
    keepAwake();
    state = "boot"; bootPos = 0; bootHold = 0;
    startMic();
  });

  cv.addEventListener("pointerdown", function (e) {
    resumeAudio();
    if (state !== "run" && state !== "attract") return;
    var r = cv.getBoundingClientRect();
    var lx = ((e.clientX - r.left) * dpr - ox) / sc, ly = ((e.clientY - r.top) * dpr - oy) / sc;
    if (ly < 48 && state === "run") { triggerAlert(); return; }
    slots.forEach(function (s) {
      if (lx < s.x || lx > s.x + s.w || ly < s.y || ly > s.y + s.h) return;
      if (s.mods[s.i] === FACE && !s.blank && s.tr < 0) { boop(lx, ly); return; }
      if (s.tr < 0 && s.delay <= 0) go(s);
    });
    if (ly > 300) { tIdx = (tIdx + 1) % TICKS.length; tChars = 0; tHold = 0; }
  });
})();
</script>
</body></html>
